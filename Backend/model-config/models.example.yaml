# 复制本文件为 models.yaml 并填入你自己的网关地址与 api_key
# 不同人用不同 key —— models.yaml 已被 gitignore，不会提交
gateway:
  base_url: http://your-gateway/v1
  api_key: sk-xxxxxxxxxxxxxxxx

# 模型名称给默认值（当前在用的几款）；可按需覆盖
models:
  llm_model: gpt-5.1-high                # 统一多模态大模型（文本+视觉）
  llm_model_strong: gpt-5.1-high
  vision_model: gpt-5.1-high             # 图片 OCR + 图表理解
  embed_model: BAAI/bge-m3               # 向量化
  web_model: moonshotai/kimi-k2:online   # 联网搜索
  image_model: gpt-image-1               # 多模态生成：图像

parsing:
  ocr_min_chars: 12        # OCR 文本少于此值 -> 视觉兜底
  pdf_page_min_chars: 8    # PDF 某页少于此值 -> 视为扫描页
  chunk_size: 1000
  chunk_overlap: 150
  enrich_max_chars: 6000

qa:
  top_k: 5
  max_rounds: 3
  context_budget: 7000
  history_turns: 4

kg:
  batch_chars: 3500
